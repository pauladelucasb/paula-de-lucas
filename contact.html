<main>

  <section class="section contact">
    <h2>Contact</h2>
    <p>
      ICC, 4th floor, Workstation 8<br>
      Department of Spanish and Portuguese<br>
      Georgetown University<br>
      Washington, D.C.
    </p>
    <p>
      Correo: <a href="mailto:pd758@georgetown.edu">pd758@georgetown.edu</a><br>
      <a href="http://www.linkedin.com/in/pauladelucasbarquero" target="_blank" rel="noopener">LinkedIn</a> ·
      <a href="mailto:pd758@georgetown.edu" target="_blank" rel="noopener">Email</a>
    </p>

    <form class="contact-form" action="https://formspree.io/f/xdeojwbn" method="POST">
      <input type="hidden" name="_next" value="thanks.html">

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="_subject" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <button type="submit" class="btn">Send</button>
    </form>
    
  </section>
</main>

<footer class="footer">
  <span id="last-updated"></span>
